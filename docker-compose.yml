services:
  transmission:
    build: .
    container_name: transmission-downloader
    environment:
      - PUID=501
      - PGID=20
      - TZ=Europe/Bratislava
      - USER=admin
      - PASS=admin
      # Включение запуска скрипта по завершении
      - TRANSMISSION_SCRIPT_TORRENT_DONE_ENABLED=true
      - TRANSMISSION_SCRIPT_TORRENT_DONE_FILENAME=/scripts/move.sh
    volumes:
      # Конфигурация
      - ./config:/config
      # Скрипты
      - ./scripts:/scripts
      # Автозапуск монитора
      - ./init-scripts:/custom-cont-init.d
      # Логи
      - ./logs:/logs
      # Папка слежения (Watch Folder) - Локальная, стабильная
      - ./watch:/watch
      # Единый маунт: стейджинг (Media/Downloads/...), временные папки
      # закачки (Media/Downloads/incomplete, complete) и библиотека
      # (Media/New, Series, TVShows) - всё на одном bind mount, иначе mv
      # между ними внутри контейнера превращается в copy+delete (см.
      # историю миграции - Downloads и incomplete/complete раньше были
      # отдельными маунтами)
      - /Volumes/DeliRAID5/Media:/media
    ports:
      - 9091:9091
      - 51414:51414
      - 51414:51414/udp
    restart: unless-stopped
