services:
  transmission:
    build: .
    container_name: transmission-downloader
    environment:
      # User and group ID for file permissions
      - PUID=1000
      - PGID=1000
      # Timezone (example: Europe/London, America/New_York, etc.)
      - TZ=Europe/London
      # Web interface credentials (CHANGE THESE!)
      - USER=your_username
      - PASS=your_password
      # Enable post-completion script
      - TRANSMISSION_SCRIPT_TORRENT_DONE_ENABLED=true
      - TRANSMISSION_SCRIPT_TORRENT_DONE_FILENAME=/scripts/move.sh
    volumes:
      # Configuration
      - ./config:/config
      # Scripts
      - ./scripts:/scripts
      # Auto-start monitor
      - ./init-scripts:/custom-cont-init.d
      # Logs
      - ./logs:/logs
      # Watch folder for automatic torrent addition
      - ./watch:/watch
      # Single mount covering Transmission's own incomplete/complete
      # download dirs (<media>/Downloads/incomplete, .../complete), the
      # staging area (<media>/Downloads/Movies, <media>/Downloads/TV-Shows)
      # and the final library (<media>/New, <media>/Series,
      # <media>/TVShows). Must be ONE bind mount - if any of these live on
      # separate mounts, mv between them becomes a slow copy+delete instead
      # of an instant rename, even on the same physical disk. UPDATE THIS PATH
      - /path/to/your/media:/media
    ports:
      - 9091:9091
      # Host port MUST match the container's internal peer-port
      # (config/settings.json) - see README's Ports section
      - 51414:51414
      - 51414:51414/udp
    restart: unless-stopped
